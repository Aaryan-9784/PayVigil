<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Razorpay Signature Electric Blue & Navy Gradient -->
    <linearGradient id="razorpayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02042b"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0c83ff"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#02042b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Razorpay Brand Orb -->
  <rect width="100" height="100" rx="26" fill="url(#razorpayGrad)"/>

  <!-- Subtle Inner Cyan Ring -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Crisp Indian Rupee Glyph (Centered) -->
  <g transform="translate(24, 22) scale(2.2)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconShadow)">
    <path d="M6 3h12" />
    <path d="M6 8h12" />
    <path d="m6 13 8.5 8" />
    <path d="M6 13h3" />
    <path d="M9 13c6.667 0 6.667-10 0-10" />
  </g>
</svg>

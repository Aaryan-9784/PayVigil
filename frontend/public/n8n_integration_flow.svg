<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background-color: #fdfbf7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="n8nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4b71"/>
      <stop offset="100%" stop-color="#ff6d5a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrow-n8n" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ea4b71"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <g opacity="0.35">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="490" x2="1200" y2="490" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="710" x2="1200" y2="710" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Title Header Banner -->
  <g transform="translate(40, 24)">
    <rect width="1120" height="54" rx="14" fill="#ffffff" stroke="#fde047" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="38" height="38" rx="10" fill="url(#n8nGrad)"/>
    <text x="27" y="33" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">n8n</text>
    <text x="58" y="34" font-size="17" font-weight="800" fill="#0f172a">n8n Visual Workflow Orchestration &amp; Multi-Channel Recovery Integration Flow</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. LEFT BOX: FASTAPI BACKEND & AI ENGINE -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 96)">
    <rect width="280" height="710" rx="16" fill="url(#cardGrad)" stroke="#facc15" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="280" height="36" rx="16" fill="#fef9c3"/>
    <text x="140" y="24" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">1. FASTAPI &amp; AI ENGINE (PORT 8000)</text>

    <!-- Node 1: Razorpay Ingestion -->
    <rect x="18" y="52" width="244" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="140" y="76" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Razorpay Webhook</text>
    <text x="140" y="96" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">POST /webhooks/razorpay</text>

    <!-- Down Arrow -->
    <line x1="140" y1="116" x2="140" y2="142" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 2: HMAC & Idempotency -->
    <rect x="18" y="146" width="244" height="64" rx="10" fill="#ffffff" stroke="#fde047" stroke-width="1.2"/>
    <text x="140" y="170" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">HMAC &amp; Idempotency</text>
    <text x="140" y="190" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Cryptographic verification</text>

    <!-- Down Arrow -->
    <line x1="140" y1="210" x2="140" y2="236" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 3: AI Engine -->
    <rect x="18" y="240" width="244" height="74" rx="10" fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
    <text x="140" y="264" font-size="11.5" font-weight="800" fill="#713f12" text-anchor="middle">AI Root Cause Diagnosis</text>
    <text x="140" y="283" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Gemini 1.5 / Groq / Heuristic</text>
    <text x="140" y="299" font-size="9.5" font-weight="700" fill="#ca8a04" text-anchor="middle">Decision: Action &amp; Confidence</text>

    <!-- Down Arrow -->
    <line x1="140" y1="314" x2="140" y2="340" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 4: Guardrails -->
    <rect x="18" y="344" width="244" height="64" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="140" y="368" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Safety Guardrails Engine</text>
    <text x="140" y="388" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">Max 3 retries &amp; 12h cooldown</text>

    <!-- Down Arrow -->
    <line x1="140" y1="408" x2="140" y2="434" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 5: n8n Dispatcher Trigger -->
    <rect x="18" y="438" width="244" height="80" rx="10" fill="#fff1f2" stroke="#ea4b71" stroke-width="1.5"/>
    <text x="140" y="464" font-size="12" font-weight="800" fill="#be123c" text-anchor="middle">⚡ n8n Webhook Dispatcher</text>
    <text x="140" y="483" font-size="10" font-weight="500" fill="#881337" text-anchor="middle">executor.py ──► trigger_n8n()</text>
    <text x="140" y="501" font-size="9.5" font-weight="700" fill="#e11d48" text-anchor="middle">POST JSON Payload to n8n:5678</text>

    <!-- Down to Database Sync -->
    <line x1="140" y1="518" x2="140" y2="556" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 6: Local Audit Trail -->
    <rect x="18" y="560" width="244" height="126" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="140" y="584" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle">Database &amp; React Dashboard</text>
    <text x="140" y="604" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">events • diagnoses • audit_log</text>
    <rect x="34" y="618" width="212" height="52" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <text x="140" y="640" font-size="10.5" font-weight="800" fill="#713f12" text-anchor="middle">React 18 Live UI Feed</text>
    <text x="140" y="658" font-size="9.5" font-weight="600" fill="#854d0e" text-anchor="middle">₹ Recovered &amp; Audit Stream</text>
  </g>

  <!-- Connect FastAPI Dispatcher -> n8n Webhook Trigger Node -->
  <path d="M 320 478 L 390 478 L 390 180 L 430 180" fill="none" stroke="#ea4b71" stroke-width="3" marker-end="url(#arrow-n8n)"/>

  <!-- ========================================================================= -->
  <!-- 2. RIGHT BIG BOX: N8N VISUAL ORCHESTRATION PIPELINE -->
  <!-- ========================================================================= -->
  <g transform="translate(430, 96)">
    <rect width="730" height="710" rx="16" fill="#ffffff" stroke="#ea4b71" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect width="730" height="38" rx="16" fill="url(#n8nGrad)"/>
    <text x="365" y="25" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">2. N8N VISUAL ORCHESTRATION PIPELINE (PORT 5678)</text>

    <!-- n8n Webhook Trigger Node -->
    <rect x="30" y="58" width="220" height="66" rx="10" fill="#fff1f2" stroke="#ea4b71" stroke-width="1.5"/>
    <text x="140" y="83" font-size="12" font-weight="800" fill="#be123c" text-anchor="middle">🪝 Webhook Trigger Node</text>
    <text x="140" y="103" font-size="10" font-weight="600" fill="#9f1239" text-anchor="middle">/webhook/revenue-recovery</text>

    <!-- Arrow to Router -->
    <line x1="250" y1="91" x2="310" y2="91" stroke="#ea4b71" stroke-width="2" marker-end="url(#arrow-n8n)"/>

    <!-- n8n Router / Switch Node -->
    <rect x="310" y="58" width="200" height="66" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="410" y="83" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">🔀 Switch / Router Node</text>
    <text x="410" y="103" font-size="10" font-weight="500" fill="#713f12" text-anchor="middle">Check: action_type</text>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- BRANCH 1: SMART RETRY WORKFLOW -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 155)">
      <rect width="670" height="130" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="20" y="24" font-size="11.5" font-weight="800" fill="#15803d">BRANCH 1: SMART RETRY &amp; MANDATE SEQUENCER (retry_payment)</text>
      
      <!-- Node A: Wait / Delay Node -->
      <rect x="20" y="38" width="180" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="110" y="62" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">⏰ Wait / Delay Node</text>
      <text x="110" y="80" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">Pause 4 hours for off-peak</text>
      <text x="110" y="96" font-size="9" font-weight="600" fill="#16a34a" text-anchor="middle">Avoids bank congestion</text>

      <line x1="200" y1="74" x2="240" y2="74" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>

      <!-- Node B: Razorpay API Re-attempt -->
      <rect x="240" y="38" width="200" height="72" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="340" y="62" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🔄 HTTP Request Node</text>
      <text x="340" y="80" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">Razorpay API: Re-attempt</text>
      <text x="340" y="96" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">Capture ₹ Recovered</text>

      <line x1="440" y1="74" x2="480" y2="74" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>

      <!-- Node C: Success Filter -->
      <rect x="480" y="38" width="170" height="72" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <text x="565" y="64" font-size="11" font-weight="800" fill="#14532d" text-anchor="middle">✓ Result Evaluator</text>
      <text x="565" y="84" font-size="9.5" font-weight="600" fill="#15803d" text-anchor="middle">Mark 'success' / ₹</text>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- BRANCH 2: MULTI-CHANNEL CUSTOMER ENGAGEMENT -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 305)">
      <rect width="670" height="150" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
      <text x="20" y="24" font-size="11.5" font-weight="800" fill="#854d0e">BRANCH 2: MULTI-CHANNEL RECOVERY DISPATCH (send_reminder_email)</text>

      <!-- Channel 1: Resend / Email -->
      <rect x="20" y="42" width="200" height="88" rx="8" fill="#ffffff" stroke="#fde047"/>
      <text x="120" y="66" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">✉️ Resend / Email Node</text>
      <text x="120" y="86" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">HTML Card Update Link</text>
      <text x="120" y="104" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">Personalized &amp; Signed</text>

      <!-- Channel 2: WhatsApp (Twilio/Gupshup) -->
      <rect x="235" y="42" width="200" height="88" rx="8" fill="#ffffff" stroke="#fde047"/>
      <text x="335" y="66" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📱 WhatsApp / Gupshup</text>
      <text x="335" y="86" font-size="9.5" font-weight="600" fill="#713f12" text-anchor="middle">🇮🇳 Hinglish Template</text>
      <text x="335" y="104" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">1-Click UPI / Card Link</text>

      <!-- Channel 3: SMS Gateway -->
      <rect x="450" y="42" width="200" height="88" rx="8" fill="#ffffff" stroke="#fde047"/>
      <text x="550" y="66" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">💬 SMS Gateway Node</text>
      <text x="550" y="86" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">Instant DLT Fast SMS</text>
      <text x="550" y="104" font-size="9" font-weight="600" fill="#854d0e" text-anchor="middle">Direct Payment Link</text>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- BRANCH 3: HUMAN ESCALATION & CRM TICKET -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 475)">
      <rect width="670" height="120" rx="12" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.2"/>
      <text x="20" y="24" font-size="11.5" font-weight="800" fill="#991b1b">BRANCH 3: HUMAN ESCALATION &amp; CRM AUTO-TICKET (escalate_to_human)</text>

      <!-- Node A: Slack Webhook -->
      <rect x="20" y="38" width="305" height="66" rx="8" fill="#ffffff" stroke="#fca5a5"/>
      <text x="172" y="62" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">💬 Slack Interactive Block Node</text>
      <text x="172" y="82" font-size="9.5" font-weight="600" fill="#dc2626" text-anchor="middle">Alert #ops-escalations with [Approve] Buttons</text>

      <!-- Node B: Zendesk / HubSpot -->
      <rect x="345" y="38" width="305" height="66" rx="8" fill="#ffffff" stroke="#fca5a5"/>
      <text x="497" y="62" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">🎫 Zendesk / HubSpot CRM Node</text>
      <text x="497" y="82" font-size="9.5" font-weight="600" fill="#991b1b" text-anchor="middle">Create High-Priority Support Ticket</text>
    </g>

    <!-- ───────────────────────────────────────────────────────────── -->
    <!-- SYNC & ACCOUNTING LOG -->
    <!-- ───────────────────────────────────────────────────────────── -->
    <g transform="translate(30, 615)">
      <rect width="670" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      
      <!-- Google Sheets -->
      <rect x="18" y="14" width="300" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
      <text x="168" y="34" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">📊 Google Sheets / Notion Node</text>
      <text x="168" y="49" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">Append recovered row for CFO / Finance Team</text>

      <!-- Respond to Webhook -->
      <rect x="338" y="14" width="314" height="46" rx="8" fill="#fef08a" stroke="#ca8a04"/>
      <text x="495" y="34" font-size="11" font-weight="800" fill="#713f12" text-anchor="middle">↩️ Respond to Webhook Node</text>
      <text x="495" y="49" font-size="9" font-weight="600" fill="#854d0e" text-anchor="middle">Return execution confirmation &amp; tracking ID</text>
    </g>
  </g>
</svg>

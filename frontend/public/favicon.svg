<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Exact matching Warm Gold & Amber Gradient from Header Logo -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Matching Header Orb -->
  <rect width="100" height="100" rx="24" fill="url(#headerGrad)"/>

  <!-- Subtle Inner Ring -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- EXACT Lucide IndianRupee Vector Icon Centered and Scaled -->
  <g transform="translate(20, 20) scale(2.5)" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconShadow)">
    <path d="M6 3h12" />
    <path d="M6 8h12" />
    <path d="m6 13 8.5 8" />
    <path d="M6 13h3" />
    <path d="M9 13c6.667 0 6.667-10 0-10" />
  </g>
</svg>
